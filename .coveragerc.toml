[tool.coverage.run]
branch = true
omit = [
    "**/*_test.py",
    "**/test_*.py",
    "mutants/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "raise NotImplementedError",
    "assert_never",
]
