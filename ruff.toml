line-length = 80
indent-width = 4

[lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY",
    "D104",
    "D105",
    "EM",
    "FIX002",
    "ISC001",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "TC001",
    "TC002",
    "TC003",
    "TD003",
    "TRY003",
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false
single-line-exclusions = ["collections.abc", "typing"]

[lint.per-file-ignores]
"scripts/**/*.py" = [
    "INP001",
    "T20",
]
"{tests/**/*.py,**/test_*.py,**/*_test.py}" = [
    "ARG",
    "D100",
    "D101",
    "D102",
    "D103",
    "INP001",
    "N802",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "S101",
    "SLF001",
]

[lint.pydocstyle]
convention = "google"
