[pytest]
addopts = [
    "--import-mode=importlib",
    "-ra",
]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]
minversion = "9.0"
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "mutants",
    "node_modules",
    "venv",
    "{arch}",
]
strict = true
tmp_path_retention_policy = "failed"
